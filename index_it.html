<!DOCTYPE html>
<html lang="it">
<head>

    <style>
        * {
            margin: 0;

            box-sizing: border-box;

        html, body {
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #0a0a0a;

        .container {

            display: flex;

        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;

        .overlay {

            width: 100%;
            min-height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 30px 40px;
            overflow: hidden;
            z-index: 10;

        .title {

            letter-spacing: 8px;

            font-family: 'Courier New', monospace;
            margin-bottom: 15px;

        .logo:hover {

        .center-logo-section a {
            text-decoration: none;
            display: inline-block;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #FF8C42;
            text-transform: uppercase;
            font-weight: normal;
            font-family: 'Courier New', monospace;
            margin-top: 8px;
        }

        .center-logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
            animation: fadeIn 1.2s ease-out;
            pointer-events: auto;
        }

        .event-name {
			font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 8px;
            color: #5BA3D0;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
            text-shadow: 0 0 20px rgba(91, 163, 208, 0.5);
        }

        .event-subtitle {
            display: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #FF8C42;
            text-transform: uppercase;
            font-weight: normal;
            font-family: 'Courier New', monospace;
            margin-top: 30px;
            animation: fadeIn 1.2s ease-out;
        }
		
		.event-details {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #5BA3D0;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
            margin-bottom: 10px;
            line-height: 1.8;
        }

        .center-instruction {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #5BA3D0;
            text-transform: uppercase;
            opacity: 0.9;
            font-family: 'Courier New', monospace;
            margin-bottom: 15px;
            animation: fadeIn 1.5s ease-out;
            pointer-events: none;
        }

        .footer {
            text-align: center;
            animation: slideUp 1s ease-out;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #FF8C42;
            font-family: 'Courier New', monospace;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid currentColor;
        }

        .legend-link {
            color: #FF8C42;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid #FF8C42;
            pointer-events: all;
            font-family: 'Courier New', monospace;
        }

        .legend-link:hover {
            color: #5BA3D0;
            border-bottom-color: #5BA3D0;
            text-shadow: 0 0 10px rgba(91, 163, 208, 0.7);
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .logo {
                width: clamp(100px, 20vh, 180px);
                height: clamp(100px, 20vh, 180px);
                margin: 0 auto 10px auto;
            }

            .overlay {
                padding: 15px 15px;
            }

            .title {
                /* keep desktop size */
                margin-bottom: 8px;
            }

            .event-name {
                /* keep desktop size */
                margin-top: 10px;
                margin-bottom: 0;
            }

            .event-subtitle {
                display: block;
            }

            .event-details {
                font-size: 0.8rem;
                margin-top: 10px;
                margin-bottom: 6px;
                line-height: 1.4;
            }

            .footer {
                display: none;
            }

            .legend {
                gap: 12px;
            }

            .legend-item {
                /* keep desktop size */
            }

            .subtitle {
                /* keep desktop size */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        
        <div class="overlay">
            <div class="header">
                <h1 class="title"> FESTAS 2026</h1>
                <p class="event-details">
				<a class="legend-link" href="locations_it.html">Centro storico di Napoli</a><br>
				22-26 giugno 2026
                </p>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #5BA3D0; border-color: #5BA3D0;"></div>

                        <div class="legend-dot" style="background: #5BA3D0; border-color: #5BA3D0;"></div>

                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #FF8C42; border-color: #FF8C42;"></div>
                        <a class="legend-link" href="venerdi.html">venerdì 26</a>
                    </div>
                </div>
                <div class="legend" style="margin-top: 15px;">
	                <div class="legend-item">
                        <a class="legend-link" href="FESTAS2026_programma.pdf" target="_blank">Locandina con programma</a>
                    </div>			
                </div>					
            </div>

            <div class="center-logo-section">
                <a href="index.html">
                    <img src="Logo_FESTAS.png" alt="FESTAS Logo" class="logo">
                </a>
                <div class="event-name">
                    NEXUS
                </div>
                <div class="event-subtitle"><a class="legend-link" href="about-us_it.html">Festival di Arte & Scienza</a></div>
            </div>

            <div class="footer" style="margin-top: auto;">
                <p class="subtitle"><a class="legend-link" href="about-us_it.html">Festival di Arte & Scienza</a></p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Color palette - bright blue and vibrant orange for dark background
        const colors = [
            '#5BA3D0',  // Bright Blue
            '#FF8C42',  // Vibrant Orange
        ];

        // Particle system
        class Particle {
            constructor(x, y, vx, vy, color, size, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.maxLife = life;
                this.life = life;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationVel = (Math.random() - 0.5) * 0.1;
                this.friction = 0.98;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += 0.15; // gravity
                this.life--;
                this.rotation += this.rotationVel;
            }

            draw(ctx) {
                const fadeStart = this.maxLife * 0.7;
                const alpha = this.life < fadeStart ? 1 : (this.life - fadeStart) / (this.maxLife - fadeStart);
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const r = this.size + Math.sin(i) * this.size * 0.3;
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Attractor {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = 0;
                this.maxRadius = 40;
                this.life = 0;
                this.maxLife = 30;
            }

            update() {
                this.life++;
                if (this.life < this.maxLife * 0.3) {
                    this.radius = (this.life / (this.maxLife * 0.3)) * this.maxRadius;
                } else if (this.life < this.maxLife * 0.7) {
                    this.radius = this.maxRadius;
                } else {
                    this.radius = Math.max(0, this.maxRadius * (1 - (this.life - this.maxLife * 0.7) / (this.maxLife * 0.3)));
                }
            }

            draw(ctx) {
                const fadeStart = this.maxLife * 0.6;
                const alpha = this.life > fadeStart ? 1 - ((this.life - fadeStart) / (this.maxLife - fadeStart)) : 1;
                
                if (this.radius > 0) {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = alpha * 0.6;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            isAlive() {
                return this.life < this.maxLife;
            }

            emit() {
                const particles = [];
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
                    const speed = 2 + Math.random() * 3;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const size = 4 + Math.random() * 6;
                    const life = 100 + Math.random() * 60;  // Increased from 40-80 to 100-160
                    particles.push(new Particle(this.x, this.y, vx, vy, this.color, size, life));
                }
                return particles;
            }
        }

        let particles = [];
        let attractors = [];
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let isMousePressed = false;
        let lastEmitX = mouseX;
        let lastEmitY = mouseY;
        let currentColor = colors[0];

        // Helper function for particle emission
        function emitTrail(x, y, color) {
            const distance = Math.hypot(x - lastEmitX, y - lastEmitY);
            if (distance > 15) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.5 + Math.random() * 1.5;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const size = 2 + Math.random() * 4;
                const life = 120 + Math.random() * 80;
                particles.push(new Particle(x, y, vx, vy, color, size, life));
                lastEmitX = x;
                lastEmitY = y;
            }
        }

        // Mouse tracking
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (isMousePressed) {
                emitTrail(mouseX, mouseY, currentColor);
            }
        });

        // Mouse down - start emission
        document.addEventListener('mousedown', (e) => {
            isMousePressed = true;
            currentColor = colors[Math.floor(Math.random() * colors.length)];
            lastEmitX = e.clientX;
            lastEmitY = e.clientY;
        });

        // Mouse up - stop emission and create burst
        document.addEventListener('mouseup', (e) => {
            const attractor = new Attractor(e.clientX, e.clientY, currentColor);
            attractors.push(attractor);
            particles.push(...attractor.emit());
            isMousePressed = false;
        });

        // Touch support
        document.addEventListener('touchstart', (e) => {
            isMousePressed = true;
            currentColor = colors[Math.floor(Math.random() * colors.length)];
            lastEmitX = e.touches[0].clientX;
            lastEmitY = e.touches[0].clientY;
        });

        document.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
            if (isMousePressed) {
                emitTrail(mouseX, mouseY, currentColor);
            }
        });

        document.addEventListener('touchend', (e) => {
            const attractor = new Attractor(mouseX, mouseY, currentColor);
            attractors.push(attractor);
            particles.push(...attractor.emit());
            isMousePressed = false;
        });

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });

            // Update and draw attractors
            ctx.globalAlpha = 1;
            attractors = attractors.filter(a => a.isAlive());
            attractors.forEach(a => {
                a.update();
                a.draw(ctx);
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
