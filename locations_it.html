<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi siamo - FESTAS 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
        }

        .container {
            width: 100%;
            min-height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .overlay {
            position: relative;
            width: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            padding: 60px 40px;
            z-index: 10;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            animation: slideDown 1s ease-out;
            margin-bottom: 40px;
            pointer-events: all;
            position: sticky;
            top: 0;
            background: #0a0a0a;
            padding: 20px 0;
            z-index: 20;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 8px;
            color: #5BA3D0;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(91, 163, 208, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: all;
        }

        .title:hover {
            color: #FF8C42;
            text-shadow: 0 0 20px rgba(255, 140, 66, 0.7);
        }

        .title a {
            text-decoration: none;
            color: inherit;
        }

        .subtitle {
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: #FF8C42;
            text-transform: uppercase;
            font-weight: normal;
            font-family: 'Courier New', monospace;
            margin-top: 8px;
        }

        .content-area {
            max-width: 800px;
            margin: 0 auto;
            flex-grow: 1;
            pointer-events: all;
            position: relative;
            width: 100%;
        }

        .click-points-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 30px;
            margin-bottom: 60px;
            align-items: start;
            background: #0a0a0a;
            padding: 40px 0;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .click-point {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .click-point-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(91, 163, 208, 0.25);
            user-select: none;
            overflow: hidden;
            border: 3px solid #5BA3D0;
        }

        .click-point-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .click-point-circle:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 48px rgba(91, 163, 208, 0.5);
        }

        .click-point-circle:hover img {
            transform: scale(1.05);
        }

        .click-point-circle.active {
            border-color: #FF8C42;
            box-shadow: 0 12px 48px rgba(255, 140, 66, 0.5);
        }

        .click-point-label {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #5BA3D0;
            text-align: center;
            transition: all 0.3s ease;
        }

        .click-point-circle.active ~ .click-point-label {
            color: #FF8C42;
        }

        .content-boxes {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            margin-top: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .content-box {
            animation: fadeIn 0.6s ease-out;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(91, 163, 208, 0.2);
            overflow: hidden;
            transition: all 0.3s ease;
            display: none;
        }

        .content-box.active {
            display: block;
        }

        .content-box:hover {
            box-shadow: 0 12px 48px rgba(91, 163, 208, 0.35);
            transform: translateY(-2px);
        }

        .box-header {
            padding: 20px;
            background: linear-gradient(135deg, #5BA3D0 0%, #7AB8E0 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .box-content {
            padding: 30px;
            color: #333333;
            font-size: 1rem;
            line-height: 1.9;
            letter-spacing: 0.5px;
            text-align: justify;
        }

        .box-content p {
            margin-bottom: 18px;
        }

        .box-content p:last-child {
            margin-bottom: 0;
        }

        .box-content a {
            color: #4fa3a3;
            text-decoration: none;
            border-bottom: 2px solid #4fa3a3;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .box-content a:hover {
            color: #ff9999;
            border-bottom-color: #ff9999;
        }

        .name-list {
            margin: 0;
            padding-left: 20px;
        }

        .name-list li {
            margin-bottom: 12px;
            list-style-type: disc;
        }

        .name-list li:last-child {
            margin-bottom: 0;
        }

        .footer {
            text-align: center;
            animation: slideUp 1s ease-out;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(91, 163, 208, 0.3);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #FF8C42;
            font-family: 'Courier New', monospace;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid currentColor;
        }

        .legend-link {
            color: #FF8C42;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid #FF8C42;
            pointer-events: all;
            font-family: 'Courier New', monospace;
        }

        .legend-link:hover {
            color: #5BA3D0;
            border-bottom-color: #5BA3D0;
            text-shadow: 0 0 10px rgba(91, 163, 208, 0.7);
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #5BA3D0;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #FF8C42;
        }

        @media (max-width: 768px) {
            .header {
                margin-bottom: 20px;
                padding: 15px 0;
            }

            .title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .click-points-container {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-bottom: 30px;
            }

            .click-point-circle {
                width: 80px;
                height: 80px;
            }

            .click-point-label {
                font-size: 0.9rem;
            }

            .box-header {
                font-size: 1rem;
                padding: 15px;
            }

            .box-content {
                padding: 20px;
                font-size: 0.9rem;
                text-align: left;
                line-height: 1.6;
            }

            .box-content p {
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="overlay">
            <div class="header">
                <h1 class="title">
                    <a href="index_it.html">FESTAS 2026</a>
                </h1>
                <p class="subtitle">I luoghi del festival</p>
            </div>

            <div class="content-area">
                <div class="click-points-container">
                    <!-- Click Point 1 -->
                    <div class="click-point">
                        <a href="https://maps.app.goo.gl/bpeq13aKet4oe4zU9" target="_blank" style="text-decoration: none;">
                            <div class="click-point-circle" id="cp1">
                                <img src="Logo_FESTAS.png" alt="FESTAS Logo">
                            </div>
                        </a>
                        <div class="click-point-label">Auditorium Novecento</div>
                    </div>

                    <!-- Click Point 2 -->
                    <div class="click-point">
                        <a href="https://maps.app.goo.gl/xdRKQcThKDuZyTj59" target="_blank" style="text-decoration: none;">
                            <div class="click-point-circle" id="cp2">
                                <img src="Logo_FESTAS.png" alt="FESTAS Logo">
                            </div>
                        </a>
                        <div class="click-point-label">Fondazione Morra Greco</div>
                    </div>

                    <!-- Click Point 3 -->
                    <div class="click-point">
                        <a href="https://maps.app.goo.gl/oyWuHzgHfH89Q6du8" target="_blank" style="text-decoration: none;">
                            <div class="click-point-circle" id="cp3">
                                <img src="Logo_FESTAS.png" alt="FESTAS Logo">
                            </div>
                        </a>
                        <div class="click-point-label">Palazzo Venezia</div>
                    </div>

                    <!-- Click Point 4 -->
                    <div class="click-point">
                        <a href="https://maps.app.goo.gl/kvmY3A56MA79eEiD8" target="_blank" style="text-decoration: none;">
                            <div class="click-point-circle" id="cp4">
                                <img src="Logo_FESTAS.png" alt="FESTAS Logo">
                            </div>
                        </a>
                        <div class="click-point-label">Galleria Port'Alba</div>
                    </div>
                </div>

            <div class="footer">
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #5BA3D0; border-color: #5BA3D0;"></div>
                        <a class="legend-link" href="FESTAS2026_Lunedì22.pdf" target="_blank">lunedì 22</a>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #FF8C42; border-color: #FF8C42;"></div>
                        martedì 23
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #5BA3D0; border-color: #5BA3D0;"></div>
                        mercoledì 24
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: #FF8C42; border-color: #FF8C42;"></div>
                        venerdì 26
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showContent(index) {
            // Hide all boxes
            document.querySelectorAll('.content-box').forEach(box => {
                box.classList.remove('active');
            });
            
            // Remove active state from all circles
            document.querySelectorAll('.click-point-circle').forEach(circle => {
                circle.classList.remove('active');
            });
            
            // Show selected box
            const selectedBox = document.getElementById('box' + index);
            selectedBox.classList.add('active');
            
            // Activate clicked circle
            document.getElementById('cp' + (index + 1)).classList.add('active');
            
            // Scroll with offset to account for sticky circles
            setTimeout(() => {
                const boxTop = selectedBox.getBoundingClientRect().top + window.scrollY;
                const offset = 150; // Height of sticky circles area
                window.scrollTo({
                    top: boxTop - offset,
                    behavior: 'smooth'
                });
            }, 100);
        }
    </script>
</body>
</html>
